name: Build Lock Agent APK

# Builds the native Device Owner lock agent (android-agent/).
# Run from GitHub -> Actions -> "Build Lock Agent APK" -> Run workflow,
# then download prepaidpay-lock-agent from the run's Artifacts.

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Compute device-owner provisioning checksum
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "PACKAGE_CHECKSUM=$(openssl dgst -binary -sha256 "$APK" | openssl base64 | tr '+/' '-_' | tr -d '=')" | tee checksum.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: prepaidpay-lock-agent
          path: |
            android-agent/app/build/outputs/apk/debug/app-debug.apk
            android-agent/app/build/outputs/apk/release/app-release-unsigned.apk
            android-agent/checksum.txt
          if-no-files-found: error
