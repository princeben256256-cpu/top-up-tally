name: Build Lock Agent APK

# Builds the native Device Owner lock agent (android-agent/).
# Run from GitHub -> Actions -> "Build Lock Agent APK" -> Run workflow,
# then download prepaidpay-lock-agent from the run's Artifacts.

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Compute device-owner provisioning checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "PACKAGE_CHECKSUM=$(openssl dgst -binary -sha256 "$APK" | openssl base64 | tr '+/' '-_' | tr -d '=')" | tee checksum.txt

      - name: Publish hosted release (permanent download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete lock-agent-latest --yes --cleanup-tag || true
          gh release create lock-agent-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            checksum.txt \
            --latest \
            --title "Lock Agent (latest)" \
            --notes "Auto-published by CI. Use with the Lock app setup card in the staff console."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: prepaidpay-lock-agent
          path: |
            android-agent/app/build/outputs/apk/debug/app-debug.apk
            android-agent/app/build/outputs/apk/release/app-release-unsigned.apk
            android-agent/checksum.txt
          if-no-files-found: error
