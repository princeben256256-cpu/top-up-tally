<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PrepaidPay</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0f;
        color: #f4f4f5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
        margin: 0 0 20px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        background: #e8375a;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>PrepaidPay needs an internet connection to check your device balance and payment status.</p>
      <button onclick="location.reload()">TRY AGAIN</button>
    </main>
  </body>
</html>
